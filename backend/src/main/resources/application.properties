server.port=8080

# DataSource Configuration (H2 File persistent)
spring.datasource.url=jdbc:h2:file:./data/aijobfinder;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for debugging/development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & Encryption Secrets
app.security.encryption-key=AiJobFinderMasterSecretKey2026Secure256BitSalt!!
app.security.jwt-secret=AiJobFinderJWTSecretSuperSecureKeyForTokenSigningAndAuthentication2026RequirementPass
app.security.jwt-expiration-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
