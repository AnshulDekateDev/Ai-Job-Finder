server.port=8080

# ==============================================================================
# DATABASE CONFIGURATION
# ==============================================================================

# 1. Cloud PostgreSQL Configuration (Uncomment when you have your Neon/Supabase URL):
# spring.datasource.url=jdbc:postgresql://ep-example.us-east-2.aws.neon.tech/neondb?sslmode=require
# spring.datasource.username=your_db_user
# spring.datasource.password=your_db_password
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect

# 2. Local Fallback Database (Active by default):
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/aijobfinder;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Auto-DDL table synchronization
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for local debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & Encryption Secrets
app.security.encryption-key=AiJobFinderMasterSecretKey2026Secure256BitSalt!!
app.security.jwt-secret=AiJobFinderJWTSecretSuperSecureKeyForTokenSigningAndAuthentication2026RequirementPass
app.security.jwt-expiration-ms=86400000

# File Upload Configuration (for Resumes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
